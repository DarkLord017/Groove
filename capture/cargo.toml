[package]
name = "capture"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "capture"
path = "main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
shared = { path = "../shared" }
rabbitmq = { path = "../integrations/rabbitmq" }
redis_store = { path = "../integrations/redis" }
